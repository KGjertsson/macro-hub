global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: [ "cadvisor:8080" ]

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]

  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - regional-statistics:8082
          - macro-series:8083
          - parliament:8084
          - election:8085
          - auth:8086
