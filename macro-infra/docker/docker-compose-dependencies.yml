version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: macrohub-postgres
    environment:
      # No application database: postgres-init/ creates one per service. Without this the image would create one named
      # after POSTGRES_USER. An existing volume ignores all three
      POSTGRES_DB: postgres
      # The image's bootstrap superuser, for the init script and maintenance. No service logs in with it. It keeps its
      # name because an existing volume has this role, and the init script connects as POSTGRES_USER
      POSTGRES_USER: macrouser
      POSTGRES_PASSWORD: macropassword
      # Read by postgres-init/ on an empty volume. An existing volume needs that script run by hand, see CLAUDE.md
      REGIONAL_STATISTICS_DB_PASSWORD: ${REGIONAL_STATISTICS_DB_PASSWORD:-regionalstatisticspassword}
      MACRO_SERIES_DB_PASSWORD: ${MACRO_SERIES_DB_PASSWORD:-macroseriespassword}
      PARLIAMENT_DB_PASSWORD: ${PARLIAMENT_DB_PASSWORD:-parliamentpassword}
      ELECTION_DB_PASSWORD: ${ELECTION_DB_PASSWORD:-electionpassword}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-authpassword}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-monitoringpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP: during an empty volume's init scripts, Postgres only answers on its socket
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
