server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/parliament
spring.datasource.username=parliament
spring.datasource.password=${PARLIAMENT_DB_PASSWORD:parliamentpassword}

# A pool, so the service recovers by itself when Postgres comes back. All services share one Postgres, whose
# max_connections is 100: at most 8 per instance leaves room for a second replica and rolling updates, and 2 stay open
# when idle. The timeout is how long a caller waits for a free or new connection, so a request fails quickly while
# Postgres is away. It doesn't limit how long a connection is used: a long SCB write isn't cut off
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Set here so jOOQ doesn't infer it from the connection
spring.jooq.sql-dialect=POSTGRES

# macro-platform's migrations (db/platform, own history table) always run first, then this service's own (db/migration). The
# platform's tables make the schema non-empty when the service's run starts, which Flyway only accepts with a baseline.
# Version 0, because it skips migrations at or below the baseline and V1 has to run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

macro.scrape.path-prefix=macro-analyzer/scrape/parliament

# JSON-only backend: no static resource handlers (/** and /webjars/**)
spring.web.resources.add-mappings=false

# Only these: the other actuator endpoints (env, beans, ...) stay off, also on the service's own port
management.endpoints.web.exposure.include=health,prometheus
# The same name as the service's Compose service, which is the service label of its logs in Loki
management.metrics.tags.application=parliament
# Fixed buckets, far fewer series than a percentiles histogram. A manual drain can run for many minutes, and the top bucket is +Inf
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s,300s
