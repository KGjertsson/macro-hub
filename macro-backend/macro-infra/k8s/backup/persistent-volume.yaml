# Retain, and held for the one claim below, as for Postgres' own volume. A hostPath doesn't enforce the capacity.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: macro-hub-backups-pv
  labels:
    app: postgres-backup
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: macro-hub-manual
  claimRef:
    namespace: macro-hub
    name: postgres-backups-pvc
  hostPath:
    path: /mnt/data/macro-hub/backups
    type: DirectoryOrCreate
