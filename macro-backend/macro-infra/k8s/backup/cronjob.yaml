# A dump per database each night, after the 22:00 UTC scrapes. The newest 7 of each database are kept, and a failed dump
# removes nothing, so a run of failures can't rotate the good ones away. "Restoring a backup" in the README says how to
# use one. Roles aren't in the dumps: the init script re-creates them from the Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: macro-hub
  labels:
    app: postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          # No workload calls the Kubernetes API, and this cluster has no RBAC, so a token here could do anything in any namespace
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:16
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres.macro-hub.svc.cluster.local
                - name: PGUSER
                  value: macrouser
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-bootstrap
                      key: POSTGRES_PASSWORD
                - name: KEEP
                  value: "7"
              command:
                - sh
                - -c
                - |
                  set -u
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  status=0
                  for db in regional_statistics macro_series parliament election; do
                      dir="/backups/$db"
                      mkdir -p "$dir"
                      # What a run left behind when it was killed mid-dump. Rotation only looks at *.dump
                      rm -f "$dir"/*.partial
                      file="$dir/$db-$stamp.dump"
                      if pg_dump --format=custom --dbname="$db" --file="$file.partial"; then
                          mv "$file.partial" "$file"
                          echo "$file: $(du -h "$file" | cut -f1)"
                          # The stamp sorts by time, so the names past the newest $KEEP are the old ones
                          ls -1 "$dir"/*.dump | sort -r | tail -n +"$((KEEP + 1))" | xargs -r rm -f
                      else
                          echo "pg_dump of $db failed, keeping its older dumps" >&2
                          rm -f "$file.partial"
                          status=1
                      fi
                  done
                  exit "$status"
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups-pvc
