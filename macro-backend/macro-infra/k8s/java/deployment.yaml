# Out of date, and not deployable as it is: the image macro-analyzer:latest and the database macroanalyzer belong to the
# monolith, which step 5 of docs/microservice-migration-guide.md retired, and no module builds that image any more.
# Step 6 of the guide replaces this file with manifests for the four services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macro-analyzer-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: macro-analyzer-java-app
  template:
    metadata:
      labels:
        app: macro-analyzer-java-app
    spec:
      containers:
        - name: macro-analyzer-java-app
          image: macro-analyzer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # The application's defaults are the Compose Postgres, so the cluster's database is named here
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://192.168.154.7:31274/macroanalyzer
