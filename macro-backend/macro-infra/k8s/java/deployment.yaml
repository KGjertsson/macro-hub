apiVersion: apps/v1
kind: Deployment
metadata:
  name: macro-analyzer-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: macro-analyzer-java-app
  template:
    metadata:
      labels:
        app: macro-analyzer-java-app
    spec:
      containers:
        - name: macro-analyzer-java-app
          image: macro-analyzer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # The application's defaults are the Compose Postgres, so the cluster's database is named here
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://192.168.154.7:31274/macroanalyzer
            # ELECTION_PARLIAMENT_URL isn't set, because parliament-service has no manifest yet (step 6 of the migration
            # guide). Until then the default, localhost:8084, answers nothing in the pod: election starts and answers
            # with Valmyndigheten's colours, and logs a warning at each 15 second retry
