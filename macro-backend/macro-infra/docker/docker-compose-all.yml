version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: macrohub-postgres
    environment:
      # No application database: postgres-init/ creates one per service. Without this the image would create one named
      # after POSTGRES_USER. An existing volume ignores all three
      POSTGRES_DB: postgres
      # The image's bootstrap superuser, for the init script and maintenance. No service logs in with it. It keeps its
      # name because an existing volume has this role, and the init script connects as POSTGRES_USER
      POSTGRES_USER: macrouser
      POSTGRES_PASSWORD: macropassword
      # Read by postgres-init/ on an empty volume. An existing volume needs that script run by hand, see CLAUDE.md
      REGIONAL_STATISTICS_DB_PASSWORD: ${REGIONAL_STATISTICS_DB_PASSWORD:-regionalstatisticspassword}
      MACRO_SERIES_DB_PASSWORD: ${MACRO_SERIES_DB_PASSWORD:-macroseriespassword}
      PARLIAMENT_DB_PASSWORD: ${PARLIAMENT_DB_PASSWORD:-parliamentpassword}
      ELECTION_DB_PASSWORD: ${ELECTION_DB_PASSWORD:-electionpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP: during an empty volume's init scripts, Postgres only answers on its socket
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  regional-statistics:
    image: regional-statistics-service:latest
    container_name: macrohub-regional-statistics
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/regional_statistics
      SPRING_DATASOURCE_USERNAME: regional_statistics
      SPRING_DATASOURCE_PASSWORD: ${REGIONAL_STATISTICS_DB_PASSWORD:-regionalstatisticspassword}
    # No memory limit: a first full SCB scrape keeps every fetched value on the heap until it is stored. If a limit is
    # added, leave room for that (see "SCB regional statistics" in CLAUDE.md for the measured peak)
    ports:
      - "8082:8082"

  macro-series:
    image: macro-series-service:latest
    container_name: macrohub-macro-series
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/macro_series
      SPRING_DATASOURCE_USERNAME: macro_series
      SPRING_DATASOURCE_PASSWORD: ${MACRO_SERIES_DB_PASSWORD:-macroseriespassword}
      RIKSBANKEN_PROD_SUBSCRIPTION_KEY: ${RIKSBANKEN_PROD_SUBSCRIPTION_KEY:-}
      FED_PROD_SUBSCRIPTION_KEY: ${FED_PROD_SUBSCRIPTION_KEY:-}
    ports:
      - "8083:8083"

  parliament:
    image: parliament-service:latest
    container_name: macrohub-parliament
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parliament
      SPRING_DATASOURCE_USERNAME: parliament
      SPRING_DATASOURCE_PASSWORD: ${PARLIAMENT_DB_PASSWORD:-parliamentpassword}
    ports:
      - "8084:8084"

  election:
    image: election-service:latest
    container_name: macrohub-election
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/election
      SPRING_DATASOURCE_USERNAME: election
      SPRING_DATASOURCE_PASSWORD: ${ELECTION_DB_PASSWORD:-electionpassword}
      # No depends_on: it starts without parliament, uses Valmyndigheten's
      # colours and keeps trying until the list has loaded (ADR 0005)
      ELECTION_PARLIAMENT_URL: http://parliament:8084
    ports:
      - "8085:8085"

  macro-frontend:
    build: ../../../macro-frontend
    image: macro-frontend:latest
    container_name: macrohub-macro-frontend
    depends_on:
      - regional-statistics
      - macro-series
      - parliament
      - election
    environment:
      # scheme://host:port only: a trailing slash or path makes every proxied request 404
      # Write literal values: an empty one, as ${X:-} can give, makes nginx exit at startup
      MACRO_SERIES_URL: http://macro-series:8083
      REGIONAL_STATISTICS_URL: http://regional-statistics:8082
      PARLIAMENT_URL: http://parliament:8084
      ELECTION_URL: http://election:8085
    ports:
      - "8081:80"

volumes:
  pgdata:
