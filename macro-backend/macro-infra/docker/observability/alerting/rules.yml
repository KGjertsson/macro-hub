apiVersion: 1

# For every rule: No Data means healthy, as a query returns nothing or only 0 while its condition isn't met, including
# for a service that is stopped or has never scraped. KeepLast on an error stops a Prometheus or Loki restart from
# changing what is firing
groups:
  - orgId: 1
    name: macro-hub
    folder: macro-hub
    interval: 1m
    rules:

      # Only with at least one service still up: a stack stopped on purpose isn't four outages, and Prometheus keeps
      # reporting up == 0 for every target while the observability stack runs without it
      - uid: macrohub-service-down
        title: Service down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Prometheus cannot scrape this service. Check its container and logs; a restart or deploy clears it within a minute."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                (up{job="services"} == bool 0) and on () (count(up{job="services"} == 1) > 0)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # A failed item retries about once a minute, so one bad minute must not fire: failures in at least 4 of the last 6
      # ten-minute windows. A ten-minute window also fits a flow where one attempt takes minutes, such as a first SCB
      # scrape, and the 20m term clears the alert once the failures stop
      - uid: macrohub-scrape-items-failing
        title: Scrape items failing persistently
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: scrape flow {{ $labels.flow }} keeps failing"
          description: "Items of this flow have failed for over half an hour. They stay pending and retry every minute. The Scrapes dashboard links to the logs, which name the item."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                (
                  count_over_time(
                    (sum by (application, flow) (increase(macro_scrape_items_total{result="failed"}[10m])) > 0)[1h:10m]
                  ) >= 4
                )
                and on (application, flow)
                (sum by (application, flow) (increase(macro_scrape_items_total{result="failed"}[20m])) > 0)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # Nothing processed for 45 minutes in all, longer than the longest single item: a first SCB scrape takes about 12.
      # Items that fail count as processed, so the alert above covers those and this one a stuck or stopped drain
      - uid: macrohub-scrape-queue-not-draining
        title: Scrape queue not draining
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: {{ $values.A.Value }} items pending, none processed"
          description: "Items are pending but no drain has finished one. The cron may be stuck, or a drain may hold the scrape lock."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                macro_scrape_queue_pending > 0
                unless on (application)
                (sum by (application) (increase(macro_scrape_items_total[30m])) > 0)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: macrohub-hikari-saturated
        title: Connection pool saturated
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: all database connections in use"
          description: "Requests are waiting for a connection. Look for a long transaction or a leak."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                max by (application) (hikaricp_connections_active) >= max by (application) (hikaricp_connections_max)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # Only with at least one service still up: a stack stopped on purpose isn't an outage. The exporter runs in the other
      # Compose project, so it reports pg_up 0 for a stopped Postgres, and also for a volume without the monitoring role
      - uid: macrohub-postgres-down
        title: Postgres down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Postgres cannot be reached"
          description: "postgres_exporter cannot log in while a service is still running. Check the macrohub-postgres container. If Postgres is running, its volume may lack the monitoring role: CLAUDE.md's Observability section has the command."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                (pg_up == bool 0) and on () (count(up{job="services"} == 1) > 0)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # The four services' pools add up to 32, so 80 of 100 means something other than a normal load
      - uid: macrohub-postgres-connections-near-max
        title: Postgres connections near maximum
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} Postgres connections in use"
          description: "Over 80% of max_connections for 5 minutes. New connections fail at the limit. The Postgres dashboard shows which database holds them."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                sum(pg_stat_database_numbackends) > 0.8 * max(pg_settings_max_connections)
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # A count rather than a share: the app has little traffic, so one 5xx could otherwise be a high share
      - uid: macrohub-gateway-5xx
        title: Gateway 5xx responses
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Gateway route {{ $labels.route }} is answering 5xx"
          description: "More than 10 responses with a 5xx status per 5 minutes on this route, sustained."
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              instant: true
              expr: |-
                sum by (route) (count_over_time({service="macro-frontend", route=~".+", level="error"}[5m])) > 10
              queryType: instant
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # A first SCB scrape holds its values on the heap for about 12 minutes before storing them, so 15 minutes of
      # continuously high heap is more than that scrape alone
      - uid: macrohub-heap-near-max
        title: JVM heap near its maximum
        condition: C
        for: 15m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: heap above 92% of its maximum"
          description: "The heap has stayed above 92% for 15 minutes, which an OutOfMemoryError usually follows."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                sum by (application) (jvm_memory_used_bytes{area="heap"}) / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.92
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # Limited to the app's project: cAdvisor reports every container on the machine
      - uid: macrohub-container-restarting
        title: Container restarting repeatedly
        condition: C
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} restarted at least 3 times in 30 minutes"
          description: "The container keeps restarting. Its logs (Macro Hub Logs dashboard) usually show why."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              expr: |-
                sum by (name) (changes(container_start_time_seconds{container_label_com_docker_compose_project="docker"}[30m])) >= 3
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
