# Database connection settings. Defaults to the Compose Postgres. Never point a default at port 31274: that is the
# microk8s cluster's database, on localhost too. Override with SPRING_DATASOURCE_URL and friends.
spring.datasource.url=jdbc:postgresql://localhost:5432/macroanalyzer
spring.datasource.username=macrouser
spring.datasource.password=macropassword

# jOOQ specific settings
spring.jooq.sql-dialect=POSTGRES

# JSON-only backend: no static resource handlers (/** and /webjars/**)
spring.web.resources.add-mappings=false
