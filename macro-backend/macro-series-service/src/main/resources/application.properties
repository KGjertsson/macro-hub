server.port=8083

# Defaults to the Compose Postgres. Never point a default at port 31274: on a machine with microk8s
# that is the cluster's database. Override with SPRING_DATASOURCE_URL and friends.
spring.datasource.url=jdbc:postgresql://localhost:5432/macro_series
spring.datasource.username=macro_series
spring.datasource.password=${MACRO_SERIES_DB_PASSWORD:macroseriespassword}

spring.jooq.sql-dialect=POSTGRES

# First macro-platform's migrations (db/platform, own history table), then this service's own (db/migration). The
# platform's tables make the schema non-empty when the service's run starts, which Flyway only accepts with a baseline.
# Version 0, because it skips migrations at or below the baseline and V1 has to run
macro.platform.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# The manual enqueue and scrape endpoints, which the gateway routes per service
macro.scrape.path-prefix=macro-analyzer/scrape/macro-series

# Optional local secrets file (gitignored), resolved relative to the working directory: macro-series-service/ under
# spring-boot:run. Compose reads the same file with --env-file
spring.config.import=optional:file:.env[.properties]

# API keys: set in .env or as environment variables
riksbanken.prod.subscription.key=${RIKSBANKEN_PROD_SUBSCRIPTION_KEY:}
fed.prod.subscription.key=${FED_PROD_SUBSCRIPTION_KEY:}

# JSON-only backend: no static resource handlers (/** and /webjars/**)
spring.web.resources.add-mappings=false
