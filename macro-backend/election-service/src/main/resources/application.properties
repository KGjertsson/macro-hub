server.port=8085

# Defaults to the Compose Postgres. Never point a default at port 31274: on a machine with microk8s
# that is the cluster's database. Override with SPRING_DATASOURCE_URL and friends.
spring.datasource.url=jdbc:postgresql://localhost:5432/election
spring.datasource.username=election
spring.datasource.password=${ELECTION_DB_PASSWORD:electionpassword}

# A pool, so the service recovers by itself when Postgres comes back. All services share one Postgres, whose
# max_connections is 100: at most 8 per instance leaves room for a second replica and rolling updates, and 2 stay open
# when idle. The timeout is how long a caller waits for a free or new connection, so a request fails quickly while
# Postgres is away. It doesn't limit how long a connection is used: a long SCB write isn't cut off
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Set here so jOOQ doesn't infer it from the connection
spring.jooq.sql-dialect=POSTGRES

# macro-platform's migrations (db/platform, own history table) always run first, then this service's own (db/migration).
# The platform's tables make the schema non-empty when the service's run starts, which Flyway only accepts with a
# baseline. Version 0, because it skips migrations at or below the baseline and V1 has to run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# The manual enqueue and scrape endpoints, which the gateway routes per service
macro.scrape.path-prefix=macro-analyzer/scrape/election

# JSON-only backend: no static resource handlers (/** and /webjars/**)
spring.web.resources.add-mappings=false

# Election's party colours, from GET /macro-analyzer/parliament/parties on parliament-service (ADR 0005). The default is
# that service under mvnw; Compose sets its service name (ELECTION_PARLIAMENT_URL). Without an answer, election uses
# Valmyndigheten's colours and keeps trying
election.parliament.url=http://localhost:8084
election.parliament.refresh-interval=1h
# Until the first list has loaded. After that a failed refresh keeps the list and waits for the next refresh-interval
election.parliament.retry-interval=15s
# For the whole exchange, on a background thread: no request waits on it
election.parliament.timeout=5s
