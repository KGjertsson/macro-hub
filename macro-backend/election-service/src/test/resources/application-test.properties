# TC_DAEMON: without it the container stops when the pool happens to hold no connection for a moment
spring.datasource.url=jdbc:tc:postgresql:16:///testdb?TC_DAEMON=true
spring.datasource.username=testuser
spring.datasource.password=testpass
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Nothing listens here, and one attempt per context is enough: tests must not read a real stack on :8084
election.parliament.url=http://localhost:1
election.parliament.retry-interval=1h
