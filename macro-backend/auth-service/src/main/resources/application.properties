server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=auth
spring.datasource.password=${AUTH_DB_PASSWORD:authpassword}

# The same sizes as the other services: see "Database" in CLAUDE.md before changing them
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

spring.jooq.sql-dialect=POSTGRES

# JSON-only backend: no static resource handlers (/** and /webjars/**)
spring.web.resources.add-mappings=false

# What the browser holds in memory, and how long a revoked session can still act: the other services only verify its signature
auth.access-token-ttl=10m
auth.session-ttl=30d
auth.email-token-ttl=1h
# At most one mail per address and purpose in this time, so the endpoints can't be used to flood someone's inbox
auth.email-token-resend-interval=1m
# The links in mails start with this, never with a request's Host header, which a caller could set
auth.public-url=${AUTH_PUBLIC_URL:http://localhost:8081}
# The account with this address is an admin, whenever it is created and at every start. Proving the address is what grants it
auth.admin-email=${AUTH_ADMIN_EMAIL:}
# Browsers accept a Secure cookie over plain http on localhost only. Anywhere else the site needs https
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
# log writes each mail, with its link, to the service's log. smtp sends it, and needs spring.mail.host
auth.mail.mode=${AUTH_MAIL_MODE:log}
auth.mail.from=${AUTH_MAIL_FROM:noreply@localhost}
# An outage of the mail provider must not mark the service as down
management.health.mail.enabled=false

# Only these: the other actuator endpoints (env, beans, ...) stay off, also on the service's own port
management.endpoints.web.exposure.include=health,prometheus
# The same name as the service's Compose service, which is the service label of its logs in Loki
management.metrics.tags.application=auth
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s,300s

# Compose turns these two on and sets the OTLP endpoint (see "Observability" in CLAUDE.md)
management.opentelemetry.enabled=false
management.tracing.export.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes[service.name]=auth
# Tempo is optional and often down: a failed export and a full span queue are dropped without a line in the service's log
logging.level.io.opentelemetry.exporter.internal.http.HttpExporter=OFF
logging.level.io.opentelemetry.sdk.trace.export.BatchSpanProcessor=OFF
