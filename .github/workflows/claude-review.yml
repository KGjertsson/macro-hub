name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the current working directory.

            First read earlier Claude review comments (`gh pr view ${{ github.event.pull_request.number }} --comments`, and
            inline review comments if `gh pr view`/`gh pr diff` can reach them). Only raise issues that are new or not yet addressed.

            Then read CLAUDE.md and check the change against its conventions, for example:
            - hexagonal architecture: controllers, cron jobs and web clients stay in adaptors/, the domain only talks to ports
            - Flyway migrations in src/main/resources/db/migration/ use the next free V<n>__ number and never edit an already merged migration
            - nothing under jooq/generated/ is edited by hand
            - new chart series set the picker metadata (category, subcategory, unit, country, maturity_months)
            - frontend: npm only, the `@/` alias, and shadcn-ui components in src/components/ui/

            Look for correctness bugs, security issues and these project-specific concerns. Skip style nitpicks
            and anything a linter or the CI build would catch. Be concise; if nothing is worth raising, say so.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for issues on specific lines,
            then post one short summary with `gh pr comment` that says what is new since the last review. Only post GitHub comments, don't submit review text as messages.
            Never approve or request changes.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
