name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macro-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-backend/macro-analyzer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: sh ./mvnw -B test
