name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-frontend
    steps:
      - uses: actions/checkout@v7
      # Same rule as .githooks/pre-commit: no .env files tracked (.env.example is allowed)
      - name: No tracked .env files
        working-directory: .
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::.env files are tracked (they contain secrets):"
            echo "$tracked" | sed 's/^/  /'
            echo "Remove them with: git rm --cached <file>"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macro-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: sh ./mvnw -B test

  # Not a required check, see docs/adrs/0008-black-box-acceptance-tests-through-the-gateway.md
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # use: false, because the script's docker build would otherwise run on this builder and not load its images
      - uses: docker/setup-buildx-action@v4
        id: buildx
        continue-on-error: true
        with:
          use: false
      # A failure here only means the script builds the image itself, which fails the job if the frontend is broken
      - uses: docker/build-push-action@v7
        id: frontend-image
        continue-on-error: true
        timeout-minutes: 5
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: macro-frontend
          tags: macro-frontend:acceptance
          load: true
          provenance: false
          cache-from: type=gha,scope=acceptance-frontend
          # mode=max, because npm ci and npm run build are in a stage whose layers aren't in the final image
          cache-to: type=gha,scope=acceptance-frontend,mode=max,ignore-error=true
      - run: sh macro-backend/macro-infra/scripts/acceptance-test.sh
        env:
          ACCEPTANCE_FRONTEND_IMAGE_ID: ${{ steps.frontend-image.outputs.digest }}

  # Not a required check, see the same ADR
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: sh macro-backend/macro-infra/scripts/compose-smoke.sh
